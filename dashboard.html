<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — JB Lim</title>
<style>
  :root {
    --bg: #0d0d0f;
    --text: #f2f2f2;
    --muted: #a0a0a6;
    --border: #2a2a2e;
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }
  .back {
    display: inline-block;
    margin-bottom: 24px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .back:hover { color: var(--accent); }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 28px;
  }
  .embed-container {
    position: relative;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 900px;
    border: 0;
    display: block;
  }
  .note {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Analytics Case Studies</h1>
    <p class="subtitle">BigQuery + Looker Studio — TikTok influencer discovery & ecommerce funnel/RFM analysis</p>

    <div class="embed-container">
      <iframe 
        src="https://datastudio.google.com/embed/reporting/5f9d834a-e402-43fd-8571-62d06b089478/page/p_8ut8fdzw5d"
        allowfullscreen>
      </iframe>
    </div>
    <p class="note">Best viewed on desktop. If it doesn't load, <a href="https://lookerstudio.google.com/reporting/YOUR-REPORT-ID" target="_blank" style="color: var(--accent);">open the full report</a>.</p>
  </div>
</body>
</html>
